services:
  - type: web
    name: arbitrage-control
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: arb-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/arbitrage.db
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: AUTH_SETUP_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_API_BASE
        value: https://api.the-odds-api.com/v4
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_KEEP
        value: "14"
      - key: AUTH_COOKIE_SECURE
        value: "true"
