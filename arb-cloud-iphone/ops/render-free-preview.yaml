# Temporary, authenticated preview only. SQLite data is NOT persistent.
# In Render's Blueprint creation form set Blueprint Path to this file.
services:
  - type: web
    name: arbitrage-private-preview
    runtime: python
    rootDir: arb-cloud-iphone
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_PREVIEW_MODE
        value: "true"
      - key: DB_PATH
        value: /tmp/arbitrage-preview/arbitrage.db
      - key: BACKUP_DIR
        value: /tmp/arbitrage-preview/backups
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_SETUP_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_API_BASE
        value: https://api.the-odds-api.com/v4
