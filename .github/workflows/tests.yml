name: Application tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arb-cloud-iphone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arb-cloud-iphone/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
