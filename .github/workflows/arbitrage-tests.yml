name: Arbitration system checks

on:
  pull_request:
    branches: [backend-upgrade]
  push:
    branches: [assisted-vetting, backend-upgrade]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arb-cloud-iphone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arb-cloud-iphone/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: pytest -q
      - run: python tests/extract_frontend.py
      - run: node --check /tmp/arbitrage-dashboard.js
