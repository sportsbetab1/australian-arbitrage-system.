name: Arbitration system checks

on:
  pull_request:
    branches: [main, backend-upgrade, assisted-vetting]
  push:
    branches: [main, assisted-vetting, backend-upgrade, 'codex/**']

jobs:
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arb-cloud-iphone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arb-cloud-iphone/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts
      - run: pytest -q
      - run: python -m scripts.smoke_local
      - run: python tests/extract_frontend.py
      - run: node --check /tmp/arbitrage-dashboard.js
      - uses: actions/upload-artifact@v4
        with:
          name: windows-recovery-source
          path: |
            arb-cloud-iphone/app/odds.py
            arb-cloud-iphone/app/database.py
            arb-cloud-iphone/app/rate_limits.py
            arb-cloud-iphone/scripts/*.py
            arb-cloud-iphone/tests/test_backup_restore.py
            arb-cloud-iphone/tests/test_odds_provider.py
            arb-cloud-iphone/tests/test_manage_auth.py
            arb-cloud-iphone/tests/test_rate_limits.py
            arb-cloud-iphone/tests/test_storage_integrity.py
            arb-cloud-iphone/pytest.ini
            arb-cloud-iphone/requirements*.txt

  windows-recovery-checks:
    needs: python-checks
    runs-on: windows-latest
    steps:
      # The repository name ends in a period, so checkout's default Windows
      # workspace is invalid. Download the tested source to a valid path.
      - uses: actions/download-artifact@v4
        with:
          name: windows-recovery-source
          path: ${{ runner.temp }}/arbitrage-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: ${{ runner.temp }}/arbitrage-source
      - run: python -m pytest tests/test_backup_restore.py tests/test_odds_provider.py tests/test_manage_auth.py tests/test_rate_limits.py tests/test_storage_integrity.py -q
        working-directory: ${{ runner.temp }}/arbitrage-source

